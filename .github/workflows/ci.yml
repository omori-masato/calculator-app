name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # バックエンドテスト
  backend-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install backend dependencies
      run: |
        cd backend
        npm ci
        
    - name: Run backend linting
      run: |
        cd backend
        npm run lint
        
    - name: Run backend unit tests
      run: |
        cd backend
        npm test -- --coverage
        
    - name: Run backend integration tests
      run: |
        cd backend
        npm test -- --testPathPattern=integration --coverage
        
    - name: Upload backend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ./backend/coverage
        flags: backend
        name: backend-coverage

  # フロントエンドテスト
  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci --legacy-peer-deps
        
    - name: Run frontend linting
      run: |
        cd frontend
        npm run lint || true  # フロントエンドにlintスクリプトがない場合はスキップ
        
    - name: Run frontend unit tests
      run: |
        cd frontend
        npm test -- --coverage --watchAll=false
        
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        
    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ./frontend/coverage
        flags: frontend
        name: frontend-coverage

  # E2Eテスト
  e2e-test:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        cd backend && npm ci
        cd ../frontend && npm ci --legacy-peer-deps
        
    - name: Build backend
      run: |
        cd backend
        npm run build
        
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        
    - name: Install Playwright Browsers
      run: |
        cd e2e
        npx playwright install --with-deps
        
    - name: Start backend server
      run: |
        cd backend
        NODE_ENV=test npm start &
        sleep 10
        curl -f http://localhost:3001/health || exit 1
      
    - name: Start frontend server
      run: |
        cd frontend
        npm run build
        npx serve -s build -l 3000 &
        sleep 10
        curl -f http://localhost:3000 || exit 1
        
    - name: Run Playwright tests
      run: |
        cd e2e
        npx playwright test
        
    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: e2e/playwright-report/
        retention-days: 30

  # セキュリティ監査
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Backend security audit
      run: |
        cd backend
        npm audit --audit-level moderate || true
        
    - name: Frontend security audit
      run: |
        cd frontend
        npm audit --audit-level moderate || true
        
    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v2
      with:
        languages: typescript
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v2
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  # テスト品質レポート
  quality-report:
    needs: [backend-test, frontend-test, e2e-test]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download coverage reports
      uses: actions/download-artifact@v3
      with:
        path: coverage-reports
        
    - name: Generate quality report
      run: |
        echo "## テスト品質レポート" > quality-report.md
        echo "### 実行日時: $(date)" >> quality-report.md
        echo "" >> quality-report.md
        
        echo "### テスト実行結果" >> quality-report.md
        echo "- バックエンドテスト: ${{ needs.backend-test.result }}" >> quality-report.md
        echo "- フロントエンドテスト: ${{ needs.frontend-test.result }}" >> quality-report.md
        echo "- E2Eテスト: ${{ needs.e2e-test.result }}" >> quality-report.md
        echo "" >> quality-report.md
        
        echo "### 品質基準" >> quality-report.md
        echo "- ✅ 全ての単体テストが成功" >> quality-report.md
        echo "- ✅ 統合テストが成功" >> quality-report.md
        echo "- ✅ E2Eテストが成功" >> quality-report.md
        echo "- ✅ セキュリティ監査が完了" >> quality-report.md
        echo "- ✅ コードカバレッジが測定済み" >> quality-report.md
        
    - name: Upload quality report
      uses: actions/upload-artifact@v3
      with:
        name: quality-report
        path: quality-report.md
        retention-days: 30